<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalyx Wallet</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6efe4; --text: #1c1813; --muted: #6f6656; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0e14; --text: #f3ece0; --muted: #a59d8f; } }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 360px; height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon/128.png" alt="" />
      <h1>Kalyx Wallet</h1>
      <p>Bientôt disponible</p>
    </main>
  </body>
</html>
