# Publication d'une mise à jour OTA sur le canal « preview ».
#
# TOUT se passe sur les serveurs EAS, jamais en local, et ce n'est pas un
# confort : la machine de développement est en arm64 alors que le `hermesc`
# livré par Expo n'existe qu'en x86-64 (SIGILL à l'export). Surtout, une mise à
# jour publiée depuis le local calcule une EMPREINTE différente de celle du
# build EAS — l'OTA ne redescend alors jamais sur le téléphone, et sans la
# moindre erreur visible. Publier depuis la même infrastructure que le build est
# la seule façon d'avoir des empreintes qui correspondent.
#
# DÉSACTIVÉ DEPUIS LE 28/09 : les mises à jour sont SIGNÉES (app.config.ts,
# `codeSigningCertificate`), et la clé privée ne quitte pas la machine de
# publication. Une mise à jour publiée ici ne serait pas signée : l'APK la
# refuserait. Publier en local :
#   npx eas-cli update --channel preview --message "…" --clear-cache \
#     --private-key-path /root/Nova-archives/ota-signing/private-key.pem
# (Plus de déclenchement automatique au push ; lancement manuel seulement.)

name: Publier une mise a jour preview (non signee - ne pas utiliser)


jobs:
  publish_update:
    name: Publier sur le canal preview
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
