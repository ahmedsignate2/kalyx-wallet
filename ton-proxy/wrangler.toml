name = "kalyx-ton-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Origines web autorisées (l'app native n'envoie pas d'en-tête Origin).
ALLOWED_ORIGINS = "https://app.kalyxwallet.com,https://kalyxwallet.com"
# Extension Kalyx : « * » pendant la bêta (identifiant pas encore fixé) ; ensuite l'identifiant du Chrome Web Store.
ALLOWED_EXTENSIONS = "*"
# MoonPay (achat de crypto) — MODE TEST. La clé publique pk_test_… se colle ici
# (elle n'est pas secrète). Passage en production : pk_live_… + MOONPAY_ENV.
MOONPAY_ENV = "sandbox"
MOONPAY_PUBLISHABLE_KEY = "pk_test_XgnnCBDwWrZFRdyzEU47fYjA58PrbXw"
MOONPAY_REDIRECT_URL = "https://kalyxwallet.com/buy/complete"

# Lectures : 30 requêtes / 10 s par IP (le cache absorbe l'essentiel).
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"
  [ratelimits.simple]
  limit = 30
  period = 10

# Envois (émulation, diffusion) : 10 / 60 s par IP.
[[ratelimits]]
name = "LIMITER_WRITE"
namespace_id = "7302"
  [ratelimits.simple]
  limit = 10
  period = 60

# SECRETS, jamais ici :
#   npx wrangler secret put TONAPI_KEY
#   npx wrangler secret put MOONPAY_SECRET_KEY   (sk_test_… en mode test)
#   npx wrangler secret put STRIPE_SECRET_KEY    (sk_test_… en mode test, sk_live_… en réel)
