name = "kalyx-ton-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Origines web autorisées (l'app native n'envoie pas d'en-tête Origin).
ALLOWED_ORIGINS = "https://app.kalyxwallet.com,https://kalyxwallet.com"

# Lectures : 30 requêtes / 10 s par IP (le cache absorbe l'essentiel).
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"
  [ratelimits.simple]
  limit = 30
  period = 10

# Envois (émulation, diffusion) : 10 / 60 s par IP.
[[ratelimits]]
name = "LIMITER_WRITE"
namespace_id = "7302"
  [ratelimits.simple]
  limit = 10
  period = 60

# SECRET, jamais ici : npx wrangler secret put TONAPI_KEY
