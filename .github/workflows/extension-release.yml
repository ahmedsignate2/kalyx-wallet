name: Extension — paquet du store

# Fabrique le .zip à déposer sur le Chrome Web Store, après typecheck et tests.
# Lancement manuel (onglet Actions) ou tag `extension-v*` (ex. extension-v0.9.0) ;
# avec un tag, le paquet est aussi joint à une release GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['extension-v*']

permissions:
  contents: write

jobs:
  package:
    name: Paquet de l'extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Install (racine, puis extension)
        run: npm ci && npm ci --prefix extension
      - name: Typecheck et tests
        run: npm run typecheck --prefix extension && npm test --prefix extension
      - name: Version du tag = version du paquet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./extension/package.json').version")
          [ "${GITHUB_REF_NAME}" = "extension-v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} ≠ extension-v$v"; exit 1; }
      - name: Build, empreinte et .zip
        working-directory: extension
        # Mode compagnon : ID de projet WalletConnect (public), variable du dépôt ; vide → mode indisponible.
        env:
          WALLETCONNECT_ID: ${{ vars.WALLETCONNECT_ID }}
        run: |
          npm run build
          npm run hash | tee ../BUILD-HASH.txt
          npm run zip
          cd .output && sha256sum *.zip > ../../SHA256SUMS.txt && cat ../../SHA256SUMS.txt
          # upload-artifact ignore les dossiers cachés (.output) : le paquet est copié à la racine.
          cp *.zip ../../
      - uses: actions/upload-artifact@v4
        with:
          name: kalyx-extension
          if-no-files-found: error
          path: |
            kalyx-extension-*.zip
            SHA256SUMS.txt
            BUILD-HASH.txt
      - name: Release GitHub (tag seulement)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" kalyx-extension-*.zip SHA256SUMS.txt BUILD-HASH.txt --prerelease --title "Extension Kalyx ${GITHUB_REF_NAME#extension-v} (bêta)" --notes-file extension/store/RELEASE-NOTES.md
