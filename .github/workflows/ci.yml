name: CI

# Exécute typecheck + tests à chaque push et chaque PR.
# Objectif : 100 % des tests au vert avant toute fusion (voir branch protection).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lancement manuel (onglet Actions ou `gh workflow run CI`).
  workflow_dispatch:

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, reproductible)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci --runInBand

  # Garde-fou anti-fuite de secret : échoue si un console.log de seed/clé
  # est introduit dans le code source.
  secret-log-guard:
    name: Anti-log de secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun fichier interdit suivi (secret, .db, build, brouillon)
        run: node scripts/check-repo-files.mjs
      - name: Bonne adresse par chaîne (pas de nouvel account.address)
        run: node scripts/check-address-usage.mjs
      - name: Interdire les logs de seed / clé privée
        run: |
          if grep -rniE "console\.(log|debug|info|warn|error)\s*\(.*(mnemonic|seed|privatekey|private_key|secret)" src; then
            echo "::error::Log potentiel d'un secret détecté dans src/."
            exit 1
          fi
          echo "OK : aucun log de secret détecté."

  # Extension de navigateur : typecheck, tests, build et empreinte du build.
  # Le cœur (src/, lib/) vient de la racine : ses dépendances aussi.
  extension:
    name: Extension (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Install (racine, puis extension)
        run: npm ci && npm ci --prefix extension
      - name: Design et textes identiques à l'app (fichiers générés à jour)
        working-directory: extension
        run: node scripts/gen-design.mjs && node scripts/gen-app-text.mjs && git diff --exit-code -- ui/tokens.css ui/icons.ts ui/appText.ts
      - name: Typecheck
        run: npm run typecheck --prefix extension
      - name: Tests
        run: npm test --prefix extension
      - name: Build et empreinte
        run: npm run build --prefix extension && npm run hash --prefix extension
