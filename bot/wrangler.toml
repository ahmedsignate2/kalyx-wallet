# Bot Telegram Kalyx — Cloudflare Worker.
# Secrets à poser avec `wrangler secret put` : BOT_TOKEN, WEBHOOK_SECRET.
name = "kalyx-telegram-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WEB_APP_URL = "https://app.kalyxwallet.com"
SITE_URL = "https://kalyxwallet.com"
DOWNLOAD_URL = "https://kalyxwallet.com/download"
SUPPORT_URL = "https://t.me/kalyxntw"

# Base SQL (adresses suivies, alertes de prix) — `wrangler d1 create kalyx-bot` puis coller l'id.
[[d1_databases]]
binding = "DB"
database_name = "kalyx-bot"
database_id = "a363a54e-a4f2-4d00-b2fa-0de2f2311ad3"

# Cache des prix / limitation de débit — `wrangler kv namespace create CACHE`.
[[kv_namespaces]]
binding = "CACHE"
id = "6bc82f49379e43d8828c37b01f653000"

# Vérification des alertes de prix toutes les 5 minutes.
# Limiteurs de débit Cloudflare : gratuits, sans écriture KV (le KV gratuit plafonne à 1 000 écritures / jour).
# namespace_id : identifiant entier propre à chaque limiteur dans le compte. period : 10 ou 60 secondes.
[[unsafe.bindings]]
name = "USER_LIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "SCAN_LIMIT"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "SCAN_GLOBAL"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["*/5 * * * *"]
